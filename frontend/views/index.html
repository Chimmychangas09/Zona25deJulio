<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Gestión de Incidencias Urbanas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-200 py-4 mb-8 shadow-sm">
        <div class="max-w-4xl mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2 font-bold text-blue-700 text-lg">
                <i class="ti ti-building-community text-2xl"></i>
                <div>Zona 25 de Julio <span class="block text-xs text-slate-400 font-normal">El Alto</span></div>
            </div>
            <nav class="flex items-center gap-3 text-sm" id="navMenu">
                <span class="text-slate-400">Invitado</span>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 flex-1 flex flex-col justify-center w-full">
        <div id="globalAlert" class="hidden items-center gap-2 p-4 mb-4 text-sm rounded-lg border shadow-sm transition-all duration-300"></div>

        <section id="viewAuth" class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm max-w-md mx-auto w-full">
            <h2 class="text-xl font-bold mb-6 text-slate-900 flex items-center gap-2 border-b-2 border-slate-100 pb-2" id="authTitle">
                <i class="ti ti-lock"></i> Ingresar al Sistema
            </h2>
            <form id="formAuth" class="space-y-4">
                <div id="groupNombre" class="hidden">
                    <label for="authNombre" class="block text-xs font-semibold text-slate-700 mb-1">Nombre Completo</label>
                    <input type="text" id="authNombre" class="w-full p-2.5 border border-slate-200 rounded-md text-sm outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-700/10 transition-all" placeholder="Ej. Juan Pérez">
                </div>
                <div>
                    <label for="authCorreo" class="block text-xs font-semibold text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="authCorreo" class="w-full p-2.5 border border-slate-200 rounded-md text-sm outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-700/10 transition-all" placeholder="admin@zona25julio.com" required>
                </div>
                <div>
                    <label for="authPassword" class="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="authPassword" class="w-full p-2.5 border border-slate-200 rounded-md text-sm outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-700/10 transition-all" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnAuthSubmit" class="w-full py-2.5 px-4 rounded-md text-sm font-medium bg-blue-700 text-white hover:bg-blue-800 transition-colors flex items-center justify-center gap-2">
                    <i class="ti ti-login"></i> Iniciar Sesión
                </button>
                <div class="text-center mt-4 text-xs text-slate-400" id="authToggleArea">
                    ¿Eres nuevo vecino? <a href="#" id="linkSwitchRegister" class="text-blue-700 font-semibold hover:underline">Regístrate aquí</a>
                </div>
            </form>
        </section>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
