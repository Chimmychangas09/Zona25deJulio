<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Gestión de Incidencias Urbanas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex flex-col min-h-screen">

    <header class="bg-slate-900 border-b border-slate-800 py-4 mb-8 shadow-md">
        <div class="max-w-4xl mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2 font-bold text-blue-400 text-lg">
                <i class="ti ti-building-community text-2xl"></i>
                <div>Zona 25 de Julio <span class="block text-xs text-slate-500 font-normal">El Alto</span></div>
            </div>
            <nav class="flex items-center gap-3 text-sm" id="navMenu">
                <span class="text-slate-500">Invitado</span>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 flex-1 flex flex-col justify-center w-full">
        <div id="globalAlert" class="hidden items-center gap-2 p-4 mb-4 text-sm rounded-lg border shadow-sm transition-all duration-300"></div>

        <section id="viewAuth" class="bg-slate-900 border border-slate-800 rounded-xl p-8 shadow-xl max-w-md mx-auto w-full">
            <h2 class="text-xl font-bold mb-6 text-slate-100 flex items-center gap-2 border-b border-slate-800 pb-2" id="authTitle">
                <i class="ti ti-lock text-blue-400"></i> Ingresar al Sistema
            </h2>
            <form id="formAuth" class="space-y-4">
                <div id="groupNombre" class="hidden">
                    <label for="authNombre" class="block text-xs font-semibold text-slate-400 mb-1">Nombre Completo</label>
                    <input type="text" id="authNombre" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-md text-sm text-slate-100 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder-slate-600" placeholder="Ej. Juan Pérez">
                </div>
                <div>
                    <label for="authCorreo" class="block text-xs font-semibold text-slate-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="authCorreo" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-md text-sm text-slate-100 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder-slate-600" placeholder="admin@zona25julio.com" required>
                </div>
                <div>
                    <label for="authPassword" class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
                    <input type="password" id="authPassword" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-md text-sm text-slate-100 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder-slate-600" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnAuthSubmit" class="w-full py-2.5 px-4 rounded-md text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 transition-colors flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                    <i class="ti ti-login"></i> Iniciar Sesión
                </button>
                <div class="text-center mt-4 text-xs text-slate-500" id="authToggleArea">
                    ¿Eres nuevo vecino? <a href="#" id="linkSwitchRegister" class="text-blue-400 font-semibold hover:underline">Regístrate aquí</a>
                </div>
            </form>
        </section>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
